# Runs the tests of the three implementations on every push.
# Each job gets a MongoDB container so the mongo store tests run too (locally they are skipped without it).
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - run: python -m pytest -q
        working-directory: python

  java:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f java/pom.xml test

  javascript:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci
        working-directory: javascript
      - run: npm test
        working-directory: javascript

  same-output:
    # The README example in the three languages: the pipeline log and the search result have to be identical.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r python/requirements.txt
      - run: mvn -B -q -f java/pom.xml package -DskipTests
      - run: npm ci
        working-directory: javascript
      - name: Pipeline and search on the sample data
        run: |
          mkdir -p out
          (cd python && python -m searchengine pipeline --data ../out/py --source cache:../sample_data/raw \
              --candidates ../sample_data/ids.txt --steps 30 --delay 0 > ../out/py.log
           python -m searchengine search --data ../out/py king england > ../out/py.json)
          java -jar java/target/stage1.jar pipeline --data out/java --source cache:sample_data/raw \
              --candidates sample_data/ids.txt --steps 30 --delay 0 > out/java.log
          java -jar java/target/stage1.jar search --data out/java king england > out/java.json
          node javascript/src/cli.js pipeline --data out/js --source cache:sample_data/raw \
              --candidates sample_data/ids.txt --steps 30 --delay 0 > out/js.log
          node javascript/src/cli.js search --data out/js king england > out/js.json
      - name: Compare the outputs
        run: |
          for lang in java js; do
            diff out/py.log out/$lang.log
            diff out/py.json out/$lang.json
          done
          echo "same output in python, java and javascript"
